# Phase 4 Scheme A — declarative pipeline + per-stage params
# Agent 主要改本文件（params / algorithm 选择）；planner.py 为薄编排层

template: single  # single | grid_global_dwa

rationale: "Phase 4 默认：单算法 RRT* 全局最佳（等同 Portfolio HEAD）"

stages:
  - id: planner
    algorithm: rrt_star
    role: global
    params:
      expand_dis: 3.13
      path_resolution: 0.4
      goal_sample_rate: 28
      max_iter: 1500
      connect_circle_dist: 34.0
      robot_radius: 0.8
