# Phase 4 Scheme A — grid global + DWA local

template: grid_global_dwa

rationale: "Dijkstra 全局 + DWA 局部，提高 goal 权重缩短跟踪路径"

stages:
  - id: global
    algorithm: dijkstra
    role: global
    params:
      resolution: 0.5
      robot_radius: 0.5

  - id: local
    algorithm: dwa
    role: local
    params:
      robot_radius: 0.5
      to_goal_cost_gain: 0.55
      obstacle_cost_gain: 1.0
      predict_time: 2.0
