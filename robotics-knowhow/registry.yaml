# 算法注册表 — Phase 3 Portfolio
# Agent 从 portfolio_allowed_algorithms 中自由选择；每轮只进化一个算法

evolution_mode: portfolio  # portfolio | locked（locked = Phase 2 单算法模式）

# Portfolio 模式下 Agent 可选算法（须在 algorithms 节有完整配置）
portfolio_allowed_algorithms:
  - dijkstra
  - astar
  - rrt_star
  - dwa

# locked 模式 fallback；Portfolio 默认算法（manifest 缺失时使用）
active_algorithm: dijkstra

algorithms:
  dwa:
    name: Dynamic Window Approach
    phase: 1
    eval_mode: dwa
    planner_snapshot: planners/dwa.py
    source:
      repo: https://github.com/AtsushiSakai/PythonRobotics
      path: PathPlanning/DynamicWindowApproach/dynamic_window_approach.py
      license: MIT
    maps_dir: maps/dwa/
    knowhow: domains/path-planning/dwa.md
    editable_in_planner:
      - to_goal_cost_gain
      - speed_cost_gain
      - obstacle_cost_gain
      - predict_time
      - v_resolution
      - yaw_rate_resolution
      - max_speed
      - max_yaw_rate
      - max_accel
      - max_delta_yaw_rate
      - robot_radius
      - robot_stuck_flag_cons

  dijkstra:
    name: Dijkstra (Grid-based)
    phase: 2
    eval_mode: grid
    planner_snapshot: planners/dijkstra.py
    source:
      repo: https://github.com/AtsushiSakai/PythonRobotics
      path: PathPlanning/Dijkstra/dijkstra.py
      license: MIT
    maps_dir: maps/grid/
    knowhow: domains/path-planning/dijkstra.md
    editable_in_planner:
      - resolution
      - robot_radius
      - motion_model

  astar:
    name: A* (Grid-based with Heuristic)
    phase: 2
    eval_mode: grid
    planner_snapshot: planners/astar.py
    source:
      repo: https://github.com/AtsushiSakai/PythonRobotics
      path: PathPlanning/AStar/a_star.py
      license: MIT
    maps_dir: maps/grid/
    knowhow: domains/path-planning/astar.md
    editable_in_planner:
      - resolution
      - robot_radius
      - heuristic_weight
      - motion_model

  rrt_star:
    name: RRT* (Optimal Sampling-based)
    phase: 2
    eval_mode: sampling
    planner_snapshot: planners/rrt_star.py
    source:
      repo: https://github.com/AtsushiSakai/PythonRobotics
      path: PathPlanning/RRTStar/rrt_star.py
      license: MIT
    maps_dir: maps/sampling/
    knowhow: domains/path-planning/rrt-star.md
    editable_in_planner:
      - expand_dis
      - path_resolution
      - goal_sample_rate
      - max_iter
      - connect_circle_dist
      - robot_radius

map_types:
  grid:
    description: 网格地图，适用于 Dijkstra/A*
    format: JSON
  sampling:
    description: 随机采样地图，适用于 RRT*
    format: JSON
  dwa:
    description: DWA 动态障碍场景
    format: JSON
