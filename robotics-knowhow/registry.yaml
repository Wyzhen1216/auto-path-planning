# 算法注册表
# Agent 通过此文件确定当前实验的算法、地图和源文件路径

# 当前激活的算法（Agent 一次只进化一个）
active_algorithm: dijkstra

# 算法配置列表
algorithms:
  # DWA - 动态窗口法（局部路径规划）
  dwa:
    eval_mode: grid
    source:
      repo: https://github.com/AtsushiSakai/PythonRobotics
      path: PathPlanning/DynamicWindowApproach/dynamic_window_approach.py
    maps_dir: autopath/maps/grid
    knowhow: domains/path-planning/dwa.md
    description: 动态窗口法，基于速度空间采样的局部避障算法

  # Dijkstra - 迪杰斯特拉算法（全局路径规划）
  dijkstra:
    eval_mode: grid
    source:
      repo: https://github.com/AtsushiSakai/PythonRobotics
      path: PathPlanning/Dijkstra/dijkstra.py
    maps_dir: autopath/maps/grid
    knowhow: domains/path-planning/dijkstra.md
    description: 基于网格的全局最短路径算法

  # A* - A星算法（全局路径规划）
  astar:
    eval_mode: grid
    source:
      repo: https://github.com/AtsushiSakai/PythonRobotics
      path: PathPlanning/AStar/a_star.py
    maps_dir: autopath/maps/grid
    knowhow: domains/path-planning/astar.md
    description: 带启发式的Dijkstra改进版，更高效的全局路径规划

  # RRT* - 快速扩展随机树（全局路径规划）
  rrt_star:
    eval_mode: sampling
    source:
      repo: https://github.com/AtsushiSakai/PythonRobotics
      path: PathPlanning/RRTStar/rrt_star.py
    maps_dir: autopath/maps/sampling
    knowhow: domains/path-planning/rrt-star.md
    description: 基于采样的概率路径规划算法，适用于高维空间